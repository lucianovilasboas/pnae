{% extends "base.html" %}
{% load static %}
{% block title %}Entrar — PNAE [CPN]{% endblock %}

{% block content %}
  <div class="mx-auto mt-10 max-w-sm rounded-lg bg-white p-6 shadow">
    <img src="{% static 'img/if-marca.svg' %}" alt="Instituto Federal"
         class="mx-auto mb-4 h-14 w-auto">
    <h1 class="mb-4 text-xl font-bold">Entrar</h1>

    {% if form.errors %}
      <p class="mb-3 rounded bg-red-50 p-2 text-sm text-red-700">
        E-mail ou senha inválidos.
      </p>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-sm font-medium">E-mail</label>
        <input type="email" name="username" id="id_username" required autofocus
               class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium">Senha</label>
        <input type="password" name="password" id="id_password" required
               class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
      </div>
      <button type="submit"
              class="w-full rounded bg-emerald-700 px-4 py-2 font-medium text-white hover:bg-emerald-800">
        Entrar
      </button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
{% endblock %}
