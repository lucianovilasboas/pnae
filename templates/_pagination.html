{% if page.paginator.num_pages > 1 %}
  <nav class="mt-4 flex items-center justify-center gap-2 text-sm">
    {% if page.has_previous %}
      <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}"
         class="rounded-full border border-slate-300 px-3 py-1.5">Anterior</a>
    {% endif %}
    <span class="text-slate-500">{{ page.number }}/{{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}"
         class="rounded-full border border-slate-300 px-3 py-1.5">Próxima</a>
    {% endif %}
  </nav>
{% endif %}
