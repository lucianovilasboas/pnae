{% extends "base.html" %}
{% block title %}QR Codes — PNAE [CPN]{% endblock %}

{% block content %}
  <h1 class="mb-2 text-2xl font-bold">Exportar QR Codes</h1>
  <div class="mb-4 rounded border border-slate-300 bg-slate-50 p-3 text-sm text-slate-700">
    O conteúdo do QR é a <strong>matrícula</strong> do estudante. A folha pode ser
    reimpressa quando precisar; nada é rotacionado.
  </div>

  <form method="post" action="{% url 'students:qr-export' %}" target="_blank"
        class="rounded-lg bg-white p-5 shadow">
    {% csrf_token %}
    <label class="block text-sm font-medium">Turma (opcional)</label>
    <select name="class_group" class="mt-1 w-full rounded border border-slate-300 p-2">
      <option value="">Todas as turmas</option>
      {% for group in class_groups %}
        <option value="{{ group.pk }}">{{ group.name }} — {{ group.academic_year }}</option>
      {% endfor %}
    </select>

    <button type="submit"
            class="mt-4 rounded bg-emerald-700 px-4 py-2 font-medium text-white hover:bg-emerald-800">
      Gerar folha de impressão
    </button>
  </form>
{% endblock %}
